name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup project structure
        run: |
          mkdir -p src/main/java/com/anvilautomation/gui
          mkdir -p src/main/java/com/anvilautomation/key
          mkdir -p src/main/resources/assets/anvilautomation/lang
          mv AnvilAutomationController.java src/main/java/com/anvilautomation/
          mv AnvilAutomationKeys.java src/main/java/com/anvilautomation/
          mv AnvilAutomationMod.java src/main/java/com/anvilautomation/
          mv BotScreen.java src/main/java/com/anvilautomation/gui/
          mv ActivationScreen.java src/main/java/com/anvilautomation/gui/
          mv KeyManager.java src/main/java/com/anvilautomation/key/
          mv en_us.json src/main/resources/assets/anvilautomation/lang/
          cp src/main/resources/assets/anvilautomation/lang/en_us.json src/main/resources/ || true

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Setup Gradle wrapper
        run: gradle wrapper --gradle-version 8.8
        env:
          GRADLE_USER_HOME: ~/.gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: anvil-automation-mod
          path: build/libs/*.jar
